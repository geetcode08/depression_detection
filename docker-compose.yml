version: "3.8"

services:
  # Backend FastAPI service
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: depression-ai-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./depression_ai.db
      - SECRET_KEY=your-256-bit-secret-use-secrets-token-hex-32
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - HF_API_TOKEN=${HF_API_TOKEN}
      - CORS_ORIGINS=http://localhost:3000
      - ENVIRONMENT=development
    volumes:
      - ./backend:/app
      - depression_ai_db:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - depression-ai-network
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Frontend Next.js service
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: depression-ai-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000/api/v1
      - NEXTAUTH_SECRET=your-nextauth-secret-change-me
      - NEXTAUTH_URL=http://localhost:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    networks:
      - depression-ai-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Optional: SQLite database persistence service
  # (SQLite is file-based, but this ensures volume management)
  db:
    image: busybox:latest
    container_name: depression-ai-db
    volumes:
      - depression_ai_db:/db
    command: sh -c "echo 'Database volume ready'"
    networks:
      - depression-ai-network

volumes:
  depression_ai_db:
    driver: local

networks:
  depression-ai-network:
    driver: bridge
